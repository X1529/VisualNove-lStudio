# nginx.conf — Production reverse proxy for VisualNovelStudio
# Internet -> 443 HTTPS -> Nginx -> Node.js:3000 -> TiDB:4000
# วางไฟล์นี้ที่ /etc/nginx/sites-available/vn หรือใช้ใน docker-compose

upstream vn_app {
    server 127.0.0.1:3000;
    # ถ้าใช้ docker-compose ให้เปลี่ยนเป็น app:3000
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name example.com www.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # TLS — ใส่ cert จาก Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers (ซ้ำกับ Node เพื่อกัน bypass)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Upload / Body
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    proxy_connect_timeout 15s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Gzip (Node ทำแล้ว แต่ Nginx ทำซ้ำสำหรับ static)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static cache — 7d สำหรับ assets
    location ~* \.(png|jpg|jpeg|gif|webp|mp3|ogg|wav|woff2?|css|js)$ {
        proxy_pass http://vn_app;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy ทั้งหมดไป Node
    location / {
        proxy_pass http://vn_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header COOP "same-origin-allow-popups";
        # ป้องกัน directory listing
        autoindex off;
    }

    # Health — ไม่ log เยอะ
    location = /health {
        proxy_pass http://vn_app;
        access_log off;
    }
    location = /health/db {
        proxy_pass http://vn_app;
        access_log off;
    }

    access_log /var/log/nginx/vn_access.log;
    error_log /var/log/nginx/vn_error.log warn;
}
