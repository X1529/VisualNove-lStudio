services:
  app:
    build: .
    container_name: vn-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./public/assets:/app/public/assets
      - ./data:/app/data
      # ถ้าต้องการ certs สำหรับ TiDB CA: ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # ถ้าต้องการ scale หลาย instance ต้องเพิ่ม Redis:
    # depends_on: [redis]

